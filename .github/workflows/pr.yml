name: build-pr

on:
  pull_request:
    branches:
      - main

env:
 HEAD_REF: ${{ github.head_ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - name: Install Node modules
        run: npm ci
      - name: Eleventy
        run: |
          npx @11ty/eleventy \
            --output='_site/${{ env.HEAD_REF }}' \
            --pathprefix='/${{ env.HEAD_REF }}/'
          LC_TIME=C date > '_site/${{ env.HEAD_REF }}/.stamp'
      # TODO: Add site preview when available (https://github.com/actions/deploy-pages#inputs-)
